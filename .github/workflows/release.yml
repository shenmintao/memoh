name: Custom Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing custom version tag
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build Linux server and bridge
        env:
          CGO_ENABLED: 0
        run: |
          mkdir -p artifacts
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" go build -trimpath -o "artifacts/memoh-server-linux-$arch" ./cmd/agent
            GOOS=linux GOARCH="$arch" go build -trimpath -o "artifacts/memoh-bridge-linux-$arch" ./cmd/bridge
          done
          tar --exclude=.git --exclude=artifacts --exclude=node_modules -czf "$RUNNER_TEMP/memoh-source.tar.gz" .
          mv "$RUNNER_TEMP/memoh-source.tar.gz" artifacts/
          (cd artifacts && sha256sum memoh-* > SHA256SUMS)
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release create "$TAG" artifacts/* --verify-tag --draft --generate-notes
