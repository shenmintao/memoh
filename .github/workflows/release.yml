name: Custom Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing custom version tag
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build Linux services
        env:
          CGO_ENABLED: 0
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9][0-9A-Za-z.+-]*$ ]] || { echo "Invalid version tag"; exit 1; }
          flags="-X github.com/felinics/memoh/internal/version.Version=$TAG -X github.com/felinics/memoh/internal/version.CommitHash=$(git rev-parse HEAD) -X github.com/felinics/memoh/internal/version.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p artifacts
          for arch in amd64 arm64; do
            for pair in server:agent channel:channel bridge:bridge mcp:mcp; do
              GOOS=linux GOARCH="$arch" go build -trimpath -ldflags "$flags" -o "artifacts/memoh-${pair%:*}-linux-$arch" "./cmd/${pair#*:}"
            done
          done
          tar --exclude=.git --exclude=artifacts --exclude=node_modules -czf "$RUNNER_TEMP/memoh-source.tar.gz" .
          mv "$RUNNER_TEMP/memoh-source.tar.gz" artifacts/
          (cd artifacts && sha256sum memoh-* > SHA256SUMS)
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: gh release create "$TAG" artifacts/* --verify-tag --draft --generate-notes
